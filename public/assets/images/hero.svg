<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"
     role="img" aria-label="ExpertHub dashboard illustration">
  <defs>
    <linearGradient id="eh-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a2c"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="eh-hero-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#8f6dff"/>
    </linearGradient>
    <filter id="eh-hero-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="640" height="400" rx="20" fill="url(#eh-hero-bg)"/>

  <!-- Ambient glows -->
  <circle cx="120" cy="120" r="80" fill="#4c8dff" opacity="0.14" filter="url(#eh-hero-blur)"/>
  <circle cx="520" cy="300" r="100" fill="#8f6dff" opacity="0.12" filter="url(#eh-hero-blur)"/>

  <!-- Left card: lesson progress -->
  <rect x="70" y="100" width="220" height="150" rx="14"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>

  <text x="90" y="128"
        font-family="system-ui, sans-serif"
        font-size="12" fill="rgba(230,236,255,0.55)"
        letter-spacing="0.06em">COURSE PROGRESS</text>

  <text x="90" y="162"
        font-family="system-ui, sans-serif"
        font-weight="700" font-size="28" fill="#e6ecff">72%</text>

  <rect x="90" y="180" width="180" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="90" y="180" width="130" height="8" rx="4" fill="url(#eh-hero-accent)"/>

  <rect x="90" y="208" width="140" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="90" y="226" width="90" height="8" rx="4" fill="rgba(255,255,255,0.04)"/>

  <!-- Right card: session -->
  <rect x="330" y="60" width="240" height="180" rx="14"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>

  <text x="350" y="88"
        font-family="system-ui, sans-serif"
        font-size="12" fill="rgba(230,236,255,0.55)"
        letter-spacing="0.06em">NEXT SESSION</text>

  <circle cx="370" cy="126" r="16" fill="url(#eh-hero-accent)"/>
  <text x="370" y="131"
        font-family="system-ui, sans-serif" font-weight="700" font-size="13"
        fill="#ffffff" text-anchor="middle">JM</text>

  <text x="398" y="122"
        font-family="system-ui, sans-serif" font-weight="600" font-size="14"
        fill="#e6ecff">Dr. Jane Mwangi</text>
  <text x="398" y="140"
        font-family="system-ui, sans-serif" font-size="12"
        fill="rgba(230,236,255,0.55)">Strategy consultation</text>

  <rect x="350" y="166" width="200" height="1" fill="rgba(255,255,255,0.06)"/>

  <text x="350" y="192"
        font-family="system-ui, sans-serif" font-size="12"
        fill="rgba(230,236,255,0.55)">Tomorrow · 10:00 AM</text>

  <rect x="350" y="204" width="80" height="22" rx="11"
        fill="url(#eh-hero-accent)"/>
  <text x="390" y="219"
        font-family="system-ui, sans-serif" font-weight="600" font-size="11"
        fill="#ffffff" text-anchor="middle">Join</text>

  <!-- Bottom wide card: recommended -->
  <rect x="70" y="278" width="500" height="86" rx="14"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>

  <text x="90" y="306"
        font-family="system-ui, sans-serif" font-size="12"
        fill="rgba(230,236,255,0.55)"
        letter-spacing="0.06em">RECOMMENDED FOR YOU</text>

  <text x="90" y="334"
        font-family="system-ui, sans-serif" font-weight="600" font-size="15"
        fill="#e6ecff">Leadership in Practice</text>
  <text x="90" y="352"
        font-family="system-ui, sans-serif" font-size="12"
        fill="rgba(230,236,255,0.55)">6 modules · 12 lessons · Certificate</text>

  <rect x="490" y="304" width="60" height="26" rx="13"
        fill="rgba(76,141,255,0.15)" stroke="rgba(76,141,255,0.35)"/>
  <text x="520" y="321"
        font-family="system-ui, sans-serif" font-weight="600" font-size="11"
        fill="#4c8dff" text-anchor="middle">Enroll</text>
</svg>
