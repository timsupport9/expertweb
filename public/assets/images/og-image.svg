<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="ExpertHub — Turn expertise into progress">
  <defs>
    <linearGradient id="eh-og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101a2c"/>
    </linearGradient>
    <linearGradient id="eh-og-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#8f6dff"/>
    </linearGradient>
    <filter id="eh-og-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#eh-og-bg)"/>

  <!-- Ambient glows -->
  <circle cx="180" cy="140" r="200" fill="#4c8dff" opacity="0.18" filter="url(#eh-og-blur)"/>
  <circle cx="1040" cy="500" r="240" fill="#8f6dff" opacity="0.15" filter="url(#eh-og-blur)"/>

  <!-- Logo mark -->
  <rect x="90" y="90" width="72" height="72" rx="18" fill="url(#eh-og-accent)"/>
  <path d="M110 140 L126 100 L142 140 M117 128 H135"
        stroke="#ffffff" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <text x="180" y="136"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="700" font-size="34" fill="#e6ecff"
        letter-spacing="-0.02em">ExpertHub</text>

  <!-- Headline -->
  <text x="90" y="300"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="800" font-size="72" fill="#e6ecff"
        letter-spacing="-0.03em">Turn expertise</text>

  <text x="90" y="380"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="800" font-size="72" fill="url(#eh-og-accent)"
        letter-spacing="-0.03em">into progress.</text>

  <!-- Subtitle -->
  <text x="90" y="450"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="400" font-size="24" fill="rgba(230,236,255,0.65)">Learn from experts. Consult with confidence.</text>

  <!-- Footer strip -->
  <text x="90" y="560"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="500" font-size="18" fill="rgba(230,236,255,0.45)"
        letter-spacing="0.06em">EXPERTHUB · LEARNING · CONSULTATION · CORPORATE TRAINING</text>
</svg>
