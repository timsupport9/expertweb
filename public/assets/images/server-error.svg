<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240"
     role="img" aria-label="Server error">
  <defs>
    <linearGradient id="eh-500-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5c5c"/>
      <stop offset="100%" stop-color="#f0a020"/>
    </linearGradient>
  </defs>

  <ellipse cx="180" cy="215" rx="140" ry="8" fill="#e6ecff" opacity="0.05"/>

  <text x="180" y="150"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="800" font-size="120" fill="url(#eh-500-accent)"
        text-anchor="middle" letter-spacing="-0.05em">500</text>

  <!-- Warning triangle -->
  <g transform="translate(180 60)">
    <path d="M0 -20 L20 12 H-20 Z"
          fill="none" stroke="rgba(240,160,32,0.6)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 -8 V4" stroke="rgba(240,160,32,0.8)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="1.2" fill="rgba(240,160,32,0.9)"/>
  </g>

  <text x="180" y="195"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="14" fill="rgba(230,236,255,0.5)"
        text-anchor="middle">The server encountered an unexpected error.</text>
</svg>
